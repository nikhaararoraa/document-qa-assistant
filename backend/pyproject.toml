[project]
name = "document-qa-assistant-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openai==2.50.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-ai==2.21.0",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.52.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "docling==2.118.1",
    "pytest==9.1.1",
    "ruff==0.16.0",
    "tiktoken==0.13.0",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on calling Depends()/Query()/etc. in argument
# defaults; that's the framework's intended pattern, not the mutable-default bug B008 flags.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
